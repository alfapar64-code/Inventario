<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Central (Modo Manual)</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; padding: 15px; margin: 0 auto; max-width: 550px; background-color: #fdfaf6; }
        h2 { color: #333; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        select, input[type="number"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;}
        .btn-limpiar { background: #dc3545; margin-top: 15px; }
        .btn-exportar { background: #17a2b8; margin-top: 15px; }
        
        /* Configuración de la tabla con Scroll */
        .table-responsive { overflow-x: auto; margin-top: 10px; border-radius: 8px; box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; min-width: 550px; }
        th, td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #dee2e6; vertical-align: middle; }
        th { background-color: #f1f3f5; color: #495057; font-size: 10px; border-top: 1px solid #dee2e6; }
        
        /* COLUMNAS FLOTANTES */
        .sticky-col-left { position: sticky; left: 0; background-color: white; z-index: 2; box-shadow: 2px 0 5px rgba(0,0,0,0.1); text-align: left; font-weight: bold; }
        .sticky-col-right { position: sticky; right: 0; background-color: #e9ecef; z-index: 2; box-shadow: -2px 0 5px rgba(0,0,0,0.1); }
        
        thead th.sticky-col-left, thead th.sticky-col-right { background-color: #f1f3f5; z-index: 3; }
        tfoot td.sticky-col-left, tfoot td.sticky-col-right { background-color: #d4edda; z-index: 3; }

        .total-cell { font-weight: bold; color: #28a745; font-size: 14px; }
        
        .edit-input { width: 100%; min-width: 40px; padding: 8px 2px; border: 1px solid #ced4da; border-radius: 4px; text-align: center; font-size: 14px; box-sizing: border-box; background-color: #fff; color: #333; }
        .edit-input:focus { border-color: #80bdff; outline: none; background-color: #e6f2ff; }
        
        .tfoot-row td { background-color: #d4edda; font-weight: bold; color: #155724; font-size: 14px; }

        .otros-block { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #dee2e6; }
        .otros-title { margin: 0 0 8px 0; font-size: 14px; color: #d35400; }
        .input-duo { display: flex; gap: 10px; }
        .input-duo div { flex: 1; }
        .input-duo label { font-size: 11px; color: #666; font-weight: normal; margin-bottom: 2px;}
    </style>
</head>
<body>
    <h2>📋 Inventario Manual Rápido</h2>
    
    <div class="card">
        <form id="inventarioForm">
            <div class="form-group">
                <label>Seleccionar Variedad u Operación:</label>
                <select name="sabor" id="sabor" onchange="toggleInputs()" required>
                    <option value="" selected disabled>-- Seleccione un Producto --</option>
                    <option value="OTROS_PRODUCTOS">📝 OTROS (Pizzas, Quesos, Panchos)</option>
                    <optgroup label="Tradicionales">
                        <option value="Jamón y Queso (JQ)">Jamón y Queso (JQ)</option>
                        <option value="Humita (HM)">Humita (HM)</option>
                        <option value="Cebolla y Queso (CQ)">Cebolla y Queso (CQ)</option>
                        <option value="Capresse (CA)">Capresse (CA)</option>
                        <option value="Roquefort y Jamón (RJ)">Roquefort y Jamón (RJ)</option>
                        <option value="Bondiola (BD)">Bondiola (BD)</option>
                        <option value="Carne Picante (CP)">Carne Picante (CP)</option>
                        <option value="Pollo (PL)">Pollo (PL)</option>
                        <option value="Cheese Burger (CB)">Cheese Burger (CB)</option>
                        <option value="Carne Cuchillo (CC)">Carne Cuchillo (CC)</option>
                        <option value="Carne Suave (CS)">Carne Suave (CS)</option>
                    </optgroup>
                    <optgroup label="Veganas / Integrales">
                        <option value="Verdura">Verdura</option>
                        <option value="Puerro y Hongos">Puerro y Hongos</option>
                        <option value="Choclo y Calabaza">Choclo y Calabaza</option>
                        <option value="Pollo al Curry">Pollo al Curry</option>
                        <option value="Carne Criolla">Carne Criolla</option>
                    </optgroup>
                    <optgroup label="Burritos">
                        <option value="Burrito de Ternera">Burrito de Ternera (Cajón x14)</option>
                        <option value="Burrito de Cerdo">Burrito de Cerdo (Cajón x14)</option>
                        <option value="Burrito de Pollo">Burrito de Pollo (Cajón x14)</option>
                        <option value="Burrito de Vegetales">Burrito de Vegetales (Cajón x14)</option>
                    </optgroup>
                </select>
            </div>
            
            <div id="manualInputs" style="display: none;">
                <div class="form-group" id="grupo_mostrador">
                    <label>🏪 Unidades en Vitrina (Mostrador):</label>
                    <input type="number" name="mostrador" id="mostrador" value="0" min="0">
                </div>
                
                <div class="form-group">
                    <label>📦 Cajones COMPLETOS (Congelador):</label>
                    <input type="number" name="cajones" id="cajones" value="0" min="0">
                </div>
                <!-- NUEVO CAMPO: Cajón incompleto -->
                <div class="form-group" id="grupo_cajones_sueltas">
                    <label>📦 Unidades Sueltas (Cajón Incompleto):</label>
                    <input type="number" name="cajones_sueltas" id="cajones_sueltas" value="0" min="0">
                </div>

                <div class="form-group" id="grupo_bandejas">
                    <label>🧊 Bandejas COMPLETAS (Heladera):</label>
                    <input type="number" name="bandejas" id="bandejas" value="0" min="0">
                </div>
                <!-- NUEVO CAMPO: Bandeja incompleta -->
                <div class="form-group" id="grupo_bandejas_sueltas">
                    <label>🧊 Unidades Sueltas (Bandeja Incompleta):</label>
                    <input type="number" name="bandejas_sueltas" id="bandejas_sueltas" value="0" min="0">
                </div>

                <div class="form-group" id="grupo_espera">
                    <label>⏳ Área de Espera (Sueltas):</label>
                    <input type="number" name="espera" id="espera" value="0" min="0">
                </div>
            </div>

            <div id="otrosInputs" style="display: none;">
                <h4 style="text-align: center; color: #333; margin-top: 0;">🍕 Carga Manual de Productos</h4>
                <div class="otros-block">
                    <h5 class="otros-title">Pizzas Grandes 32cm</h5>
                    <div class="input-duo">
                        <div><label>Crudas</label><input type="number" id="pg_crudas" value="0" min="0"></div>
                        <div><label>Cocidas</label><input type="number" id="pg_cocidas" value="0" min="0"></div>
                    </div>
                </div>
                <div class="otros-block">
                    <h5 class="otros-title">Pizzas Individuales 18cm</h5>
                    <div class="input-duo">
                        <div><label>Crudas</label><input type="number" id="pi_crudas" value="0" min="0"></div>
                        <div><label>Cocidas</label><input type="number" id="pi_cocidas" value="0" min="0"></div>
                    </div>
                </div>
                <div class="otros-block">
                    <h5 class="otros-title" style="color:#c0392b;">Panchos</h5>
                    <div class="input-duo">
                        <div><label>Crudos</label><input type="number" id="pancho_crudos" value="0" min="0"></div>
                        <div><label>Cocidos</label><input type="number" id="pancho_cocidos" value="0" min="0"></div>
                    </div>
                </div>
                <div class="otros-block">
                    <h5 class="otros-title" style="color:#f39c12;">Quesos Muzarella</h5>
                    <div class="input-duo">
                        <div><label>Unidades Totales</label><input type="number" id="queso_unidades" value="0" min="0"></div>
                    </div>
                </div>
            </div>
            
            <button type="submit" id="btnCalcular" style="display: none;">➕ Añadir al Inventario</button>
        </form>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; text-align: center;">Vista Preliminar Editable</h3>
        <p style="text-align: center; font-size: 11px; color: #666;">Desliza la tabla y corrige los números si es necesario.</p>
        <div class="table-responsive">
            <table id="tablaResultados">
                <thead>
                    <tr>
                        <th class="sticky-col-left">Producto</th>
                        <th>Vitr.</th>
                        <th>Cong.</th>
                        <th>Helad.</th>
                        <th>Esp.</th>
                        <th>Crudos</th>
                        <th>Cocidos</th>
                        <th class="sticky-col-right">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <tr><td colspan="8" style="text-align: center; color: #888;">Sin registros aún</td></tr>
                </tbody>
                <tfoot id="tablaFoot"></tfoot>
            </table>
        </div>
        <button class="btn-exportar" onclick="exportarCSV()">📥 Exportar a Excel (CSV)</button>
        <button class="btn-limpiar" onclick="limpiarInventario()">🗑️ Borrar Todo y Empezar de Cero</button>
    </div>

    <script>
        // RECUPERAR INVENTARIO DE LA MEMORIA DEL TELÉFONO O INICIAR UNO NUEVO
        let inventario = JSON.parse(localStorage.getItem('inventario_app_empanadas')) || {};

        function toggleInputs() {
            const sabor = document.getElementById('sabor').value;
            const manualInputs = document.getElementById('manualInputs');
            const otrosInputs = document.getElementById('otrosInputs');
            const btnCalcular = document.getElementById('btnCalcular');
            
            if (!sabor) {
                manualInputs.style.display = 'none';
                otrosInputs.style.display = 'none';
                btnCalcular.style.display = 'none';
                return;
            } else {
                btnCalcular.style.display = 'block';
            }

            // Elementos dinámicos
            const grupoBandejas = document.getElementById('grupo_bandejas');
            const grupoBandejasSueltas = document.getElementById('grupo_bandejas_sueltas');
            const grupoEspera = document.getElementById('grupo_espera');
            
            const congeladosDirectos = [
                "Verdura", 
                "Cebolla y Queso (CQ)", 
                "Pollo al Curry", 
                "Carne Criolla", 
                "Choclo y Calabaza", 
                "Puerro y Hongos"
            ];

            // Ocultar bandejas y espera para congeladas directas y TODOS los burritos
            if (congeladosDirectos.includes(sabor) || sabor.includes('Burrito')) {
                if (grupoBandejas) grupoBandejas.style.display = 'none';
                if (grupoBandejasSueltas) grupoBandejasSueltas.style.display = 'none';
                if (grupoEspera) grupoEspera.style.display = 'none';
                
                // Reiniciar a cero para que no haya sumas accidentales "fantasma"
                document.getElementById('bandejas').value = 0;
                document.getElementById('bandejas_sueltas').value = 0;
                document.getElementById('espera').value = 0;
            } else {
                // Mostrar para los demás productos
                if (grupoBandejas) grupoBandejas.style.display = 'block';
                if (grupoBandejasSueltas) grupoBandejasSueltas.style.display = 'block';
                if (grupoEspera) grupoEspera.style.display = 'block';
            }

            if (sabor === 'OTROS_PRODUCTOS') {
                manualInputs.style.display = 'none';
                otrosInputs.style.display = 'block';
                btnCalcular.innerText = "➕ Guardar Productos Manuales";
            } else {
                manualInputs.style.display = 'block';
                otrosInputs.style.display = 'none';
                btnCalcular.innerText = "➕ Añadir al Inventario";
            }
        }

        function inicializarSabor(sabor) {
            if (!inventario[sabor]) {
                inventario[sabor] = { mostrador: 0, congelador: 0, heladera: 0, espera: 0, crudos: 0, cocidos: 0 };
            }
        }

        function editarCelda(sabor, campo, valor) {
            let val = parseInt(valor) || 0;
            if (val < 0) val = 0;
            inventario[sabor][campo] = val;
            actualizarTabla();
        }

        function actualizarTabla() {
            const tbody = document.getElementById('tablaBody');
            const tfoot = document.getElementById('tablaFoot');
            tbody.innerHTML = ''; tfoot.innerHTML = '';
            let hayDatos = false;
            let sumas = { mostrador: 0, congelador: 0, heladera: 0, espera: 0, crudos: 0, cocidos: 0, totalGeneral: 0 };
            
            for (const [sabor, loc] of Object.entries(inventario)) {
                const total = loc.mostrador + loc.congelador + loc.heladera + loc.espera + loc.crudos + loc.cocidos;
                if (total > 0 || loc.mostrador>0 || loc.congelador>0 || loc.heladera>0 || loc.espera>0 || loc.crudos>0 || loc.cocidos>0) {
                    hayDatos = true;
                    sumas.mostrador += loc.mostrador; sumas.congelador += loc.congelador;
                    sumas.heladera += loc.heladera; sumas.espera += loc.espera;
                    sumas.crudos += loc.crudos; sumas.cocidos += loc.cocidos;
                    sumas.totalGeneral += total;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="sticky-col-left">${sabor}</td>
                        <td><input type="number" class="edit-input" value="${loc.mostrador}" onchange="editarCelda('${sabor}', 'mostrador', this.value)"></td>
                        <td><input type="number" class="edit-input" value="${loc.congelador}" onchange="editarCelda('${sabor}', 'congelador', this.value)"></td>
                        <td><input type="number" class="edit-input" value="${loc.heladera}" onchange="editarCelda('${sabor}', 'heladera', this.value)"></td>
                        <td><input type="number" class="edit-input" value="${loc.espera}" onchange="editarCelda('${sabor}', 'espera', this.value)"></td>
                        <td><input type="number" class="edit-input" value="${loc.crudos}" onchange="editarCelda('${sabor}', 'crudos', this.value)"></td>
                        <td><input type="number" class="edit-input" value="${loc.cocidos}" onchange="editarCelda('${sabor}', 'cocidos', this.value)"></td>
                        <td class="sticky-col-right total-cell">${total}</td>`;
                    tbody.appendChild(tr);
                }
            }
            if (hayDatos) {
                tfoot.innerHTML = `
                    <tr class="tfoot-row">
                        <td class="sticky-col-left" style="text-align: right;">TOTAL:</td>
                        <td>${sumas.mostrador}</td>
                        <td>${sumas.congelador}</td>
                        <td>${sumas.heladera}</td>
                        <td>${sumas.espera}</td>
                        <td>${sumas.crudos}</td>
                        <td>${sumas.cocidos}</td>
                        <td class="sticky-col-right">${sumas.totalGeneral}</td>
                    </tr>`;
            } else {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #888;">Sin registros aún</td></tr>`;
            }

            // GUARDAR AUTOMÁTICAMENTE EN EL TELÉFONO CADA VEZ QUE LA TABLA CAMBIA
            localStorage.setItem('inventario_app_empanadas', JSON.stringify(inventario));
        }

        function limpiarInventario() {
            if(confirm("¿Seguro que quieres borrar todo el inventario y empezar de cero?")) { 
                inventario = {}; 
                // BORRAR TAMBIÉN LA MEMORIA DEL TELÉFONO
                localStorage.removeItem('inventario_app_empanadas');
                actualizarTabla(); 
            }
        }

        function exportarCSV() {
            let csv = '\uFEFFProducto;Vitrina;Congelador;Heladera;Espera;Crudos;Cocidos;TOTAL\n';
            for (const [sabor, loc] of Object.entries(inventario)) {
                const total = loc.mostrador + loc.congelador + loc.heladera + loc.espera + loc.crudos + loc.cocidos;
                if (total > 0 || loc.mostrador>0 || loc.congelador>0 || loc.heladera>0 || loc.espera>0 || loc.crudos>0 || loc.cocidos>0) {
                    csv += `${sabor};${loc.mostrador};${loc.congelador};${loc.heladera};${loc.espera};${loc.crudos};${loc.cocidos};${total}\n`;
                }
            }
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url); link.setAttribute("download", "Inventario.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        document.getElementById('inventarioForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const sabor = document.getElementById('sabor').value;
            
            // Si elige "Otros Productos"
            if (sabor === 'OTROS_PRODUCTOS') {
                const pgc = parseInt(document.getElementById('pg_crudas').value) || 0;
                const pgo = parseInt(document.getElementById('pg_cocidas').value) || 0;
                if (pgc > 0 || pgo > 0) { inicializarSabor('Pizza Grande 32cm'); inventario['Pizza Grande 32cm'].crudos += pgc; inventario['Pizza Grande 32cm'].cocidos += pgo; }
                
                const pic = parseInt(document.getElementById('pi_crudas').value) || 0;
                const pio = parseInt(document.getElementById('pi_cocidas').value) || 0;
                if (pic > 0 || pio > 0) { inicializarSabor('Pizza Indiv. 18cm'); inventario['Pizza Indiv. 18cm'].crudos += pic; inventario['Pizza Indiv. 18cm'].cocidos += pio; }
                
                const panc = parseInt(document.getElementById('pancho_crudos').value) || 0;
                const pano = parseInt(document.getElementById('pancho_cocidos').value) || 0;
                if (panc > 0 || pano > 0) { inicializarSabor('Panchos'); inventario['Panchos'].crudos += panc; inventario['Panchos'].cocidos += pano; }
                
                const queso = parseInt(document.getElementById('queso_unidades').value) || 0;
                if (queso > 0) { inicializarSabor('Quesos Muzarella'); inventario['Quesos Muzarella'].crudos += queso; }
                
                actualizarTabla(); 
                document.getElementById('inventarioForm').reset(); 
                toggleInputs(); 
                return;
            }

            // Extracción de datos del formulario para empanadas/burritos
            const mostrador = parseInt(document.getElementById('mostrador').value) || 0;
            const cajones = parseInt(document.getElementById('cajones').value) || 0;
            const cajones_sueltas = parseInt(document.getElementById('cajones_sueltas').value) || 0;
            
            const bandejas = parseInt(document.getElementById('bandejas').value) || 0;
            const bandejas_sueltas = parseInt(document.getElementById('bandejas_sueltas').value) || 0;
            
            const espera = parseInt(document.getElementById('espera').value) || 0;
            
            const multiplicador = sabor.includes('Burrito') ? 14 : 30;
            
            inicializarSabor(sabor);
            
            // Asignación con suma de las unidades sueltas extra
            inventario[sabor].mostrador += mostrador;
            inventario[sabor].congelador += (cajones * multiplicador) + cajones_sueltas;
            inventario[sabor].heladera += (bandejas * 40) + bandejas_sueltas;
            inventario[sabor].espera += espera;
            
            actualizarTabla(); 
            document.getElementById('inventarioForm').reset(); 
            toggleInputs();
        });

        // Cargar datos al iniciar la página
        actualizarTabla();
    </script>
</body>
</html>
