<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Central</title>
    <style>
        body { 
            font-family: -apple-system, Arial, sans-serif; padding: 15px; margin: 0 auto; max-width: 500px;
            background-color: #fdfaf6; 
        }
        h2 { color: #333; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        select, input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;}
        .btn-limpiar { background: #dc3545; margin-top: 15px; }
        .btn-grabar { background: #007bff; }
        .file-box { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px dashed #adb5bd; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background-color: #f1f3f5; color: #495057; }
        .total-cell { font-weight: bold; color: #28a745; font-size: 16px; }
        #estadoGrabacion { color: #dc3545; font-weight: bold; display: none; text-align: center; margin-top: 10px; animation: parpadeo 1s infinite; }
        @keyframes parpadeo { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <h2>📋 Inventario Rápido</h2>
    
    <div class="card">
        <form id="inventarioForm">
            <div class="form-group">
                <label>Seleccionar Variedad u Operación:</label>
                <select name="sabor" id="sabor" onchange="toggleInputs()">
                    <option value="MOSTRADOR_COMPLETO">📸 VITRINA COMPLETA (Foto Mostrador)</option>
                    <option value="CAJON_CONGELADOS">🧊 CAJÓN CONGELADOS (4 Sabores)</option>
                    <optgroup label="Tradicionales">
                        <option value="Jamón y Queso (JQ)">Jamón y Queso (JQ)</option>
                        <option value="Humita (HM)">Humita (HM)</option>
                        <option value="Cebolla y Queso (CQ)">Cebolla y Queso (CQ)</option>
                        <option value="Capresse (CA)">Capresse (CA)</option>
                        <option value="Roquefort y Jamón (RJ)">Roquefort y Jamón (RJ)</option>
                        <option value="Bondiola (BD)">Bondiola (BD)</option>
                        <option value="Carne Picante (CP)">Carne Picante (CP)</option>
                        <option value="Pollo (PL)">Pollo (PL)</option>
                        <option value="Cheese Burger (CB)">Cheese Burger (CB)</option>
                        <option value="Carne Cuchillo (CC)">Carne Cuchillo (CC)</option>
                        <option value="Carne Suave (CS)">Carne Suave (CS)</option>
                    </optgroup>
                    <optgroup label="Veganas / Integrales">
                        <option value="Verdura">Verdura</option>
                        <option value="Puerro y Hongos">Puerro y Hongos</option>
                        <option value="Choclo y Calabaza">Choclo y Calabaza</option>
                        <option value="Pollo al Curry">Pollo al Curry</option>
                        <option value="Carne Criolla">Carne Criolla</option>
                    </optgroup>
                    <optgroup label="Burritos">
                        <option value="Burrito de Ternera">Burrito de Ternera (Cajón x14)</option>
                    </optgroup>
                </select>
            </div>
            
            <div id="manualInputs" style="display: none;">
                <div class="form-group">
                    <label>📦 Cajones COMPLETOS:</label>
                    <input type="number" name="cajones" id="cajones" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>🧊 Bandejas COMPLETAS (Heladera):</label>
                    <input type="number" name="bandejas" id="bandejas" value="0" min="0">
                </div>
                <div class="form-group">
                    <label>⏳ Área de Espera (Sueltas):</label>
                    <input type="number" name="espera" id="espera" value="0" min="0">
                </div>
            </div>

            <!-- OPIONES DE FOTO -->
            <div id="zonaFotos">
                <div class="file-box">
                    <label>📷 Opción 1: Abrir Cámara Directa</label>
                    <input type="file" name="foto" id="foto" accept="image/*" capture="environment">
                </div>
                <div class="file-box">
                    <label>🖼️ Opción 2: Elegir de la Galería</label>
                    <input type="file" name="foto_galeria" id="foto_galeria" accept="image/*">
                </div>
                <button type="submit" id="btnCalcular">➕ Sumar al Inventario por Foto</button>
            </div>
            
            <!-- OPCION DE DICTADO POR VOZ -->
            <div id="zonaVoz" class="file-box" style="margin-top: 15px;">
                <label style="text-align: center; font-size: 16px;">🎙️ Dictar Mostrador por Voz</label>
                <p style="font-size: 12px; color: #666; text-align: center;">Ej: "12 jamón y queso, 5 humitas..."</p>
                <button type="button" id="btnGrabar" class="btn-grabar">🔴 Iniciar Grabación</button>
                <p id="estadoGrabacion">Grabando... (Habla ahora)</p>
            </div>

        </form>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; text-align: center;">Resumen Acumulado</h3>
        <table id="tablaResultados">
            <thead>
                <tr>
                    <th>Sabor</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
                <tr><td colspan="2" style="text-align: center; color: #888;">Sin registros aún</td></tr>
            </tbody>
        </table>
        <button class="btn-limpiar" onclick="limpiarInventario()">🗑️ Borrar Todo y Empezar de Cero</button>
    </div>

    <script>
        let inventario = {};
        const mapaMostrador = {
            "JQ": "Jamón y Queso (JQ)", "HM": "Humita (HM)", "CQ": "Cebolla y Queso (CQ)", 
            "CA": "Capresse (CA)", "RJ": "Roquefort y Jamón (RJ)", "BD": "Bondiola (BD)", 
            "CP": "Carne Picante (CP)", "PL": "Pollo (PL)", "CB": "Cheese Burger (CB)", 
            "CC": "Carne Cuchillo (CC)", "CS": "Carne Suave (CS)"
        };

        function toggleInputs() {
            const sabor = document.getElementById('sabor').value;
            const manualInputs = document.getElementById('manualInputs');
            const zonaFotos = document.getElementById('zonaFotos');
            const zonaVoz = document.getElementById('zonaVoz');
            
            // Oculta campos manuales para las operaciones múltiples
            if (sabor === 'MOSTRADOR_COMPLETO' || sabor === 'CAJON_CONGELADOS') {
                manualInputs.style.display = 'none';
            } else {
                manualInputs.style.display = 'block';
            }
            
            // Muestra el botón de Voz SÓLO cuando elegimos la vitrina completa
            if (sabor === 'MOSTRADOR_COMPLETO') {
                zonaVoz.style.display = 'block';
            } else {
                zonaVoz.style.display = 'none';
            }
        }

        function actualizarTabla() {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';
            let hayDatos = false;
            
            for (const [sabor, cantidad] of Object.entries(inventario)) {
                if (cantidad > 0) {
                    hayDatos = true;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${sabor}</td><td class="total-cell">${cantidad}</td>`;
                    tbody.appendChild(tr);
                }
            }
            if (!hayDatos) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align: center; color: #888;">Sin registros aún</td></tr>`;
            }
        }

        function limpiarInventario() {
            if(confirm("¿Seguro que quieres limpiar todo el conteo actual?")) {
                inventario = {};
                actualizarTabla();
            }
        }

        // ---- LÓGICA PARA ENVIAR FOTOS ----
        document.getElementById('inventarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnCalcular');
            btn.innerText = 'Procesando Foto...';
            btn.disabled = true;

            const formData = new FormData(e.target);

            try {
                const response = await fetch('/calcular', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                } else if (data.tipo === 'mostrador') {
                    for (const [sigla, cant] of Object.entries(data.datos)) {
                        const nombreCompleto = mapaMostrador[sigla] || sigla;
                        inventario[nombreCompleto] = (inventario[nombreCompleto] || 0) + parseInt(cant);
                    }
                } else if (data.tipo === 'cajon_multiple') {
                    for (const [nombreSabor, cant] of Object.entries(data.datos)) {
                        inventario[nombreSabor] = (inventario[nombreSabor] || 0) + parseInt(cant);
                    }
                } else if (data.tipo === 'individual') {
                    inventario[data.sabor] = (inventario[data.sabor] || 0) + parseInt(data.total);
                }
                actualizarTabla();
                document.getElementById('inventarioForm').reset();
                toggleInputs();
            } catch (error) {
                alert('Ocurrió un error al procesar los datos de la foto.');
            } finally {
                btn.innerText = '➕ Sumar al Inventario por Foto';
                btn.disabled = false;
            }
        });

        // ---- LÓGICA PARA DICTADO POR VOZ ----
        let mediaRecorder;
        let audioChunks = [];
        const btnGrabar = document.getElementById('btnGrabar');
        const estadoGrabacion = document.getElementById('estadoGrabacion');

        btnGrabar.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // Detener grabación
                mediaRecorder.stop();
                btnGrabar.innerText = 'Procesando Audio...';
                btnGrabar.style.background = '#6c757d';
                btnGrabar.disabled = true;
                estadoGrabacion.style.display = 'none';
            } else {
                // Iniciar grabación (Pide permisos de micrófono)
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.addEventListener('dataavailable', event => {
                        audioChunks.push(event.data);
                    });

                    mediaRecorder.addEventListener('stop', async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        enviarAudio(audioBlob);
                    });

                    mediaRecorder.start();
                    btnGrabar.innerText = '⏹️ Detener y Enviar';
                    btnGrabar.style.background = '#dc3545';
                    estadoGrabacion.style.display = 'block';
                } catch (err) {
                    alert('No se pudo acceder al micrófono. Por favor, dale permisos a la página. Error: ' + err.message);
                }
            }
        });

        async function enviarAudio(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'dictado.webm');

            try {
                const response = await fetch('/dictar', { method: 'POST', body: formData });
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                } else if (data.tipo === 'dictado') {
                    for (const [sabor, cant] of Object.entries(data.datos)) {
                        inventario[sabor] = (inventario[sabor] || 0) + parseInt(cant);
                    }
                    actualizarTabla();
                    alert("¡Dictado procesado y sumado con éxito!");
                }
            } catch (error) {
                alert('Error al enviar el audio.');
            } finally {
                btnGrabar.innerText = '🔴 Iniciar Grabación';
                btnGrabar.style.background = '#007bff';
                btnGrabar.disabled = false;
            }
        }

        toggleInputs();
    </script>
</body>
</html>
