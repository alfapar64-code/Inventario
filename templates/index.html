<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Central</title>
    <style>
        body { 
            font-family: sans-serif; padding: 15px; margin: 0 auto; max-width: 500px;
            background-color: #fdfaf6; /* Fondo Crema Calido */
        }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        select, input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;}
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;}
        .btn-limpiar { background: #dc3545; margin-top: 10px; }
        .file-box { background: #f1f3f5; padding: 10px; border-radius: 8px; margin: 10px 0; border: 1px dashed #999; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">📋 Inventario Rápido</h2>
    <div class="card">
        <form id="inventarioForm">
            <label>Sabor:</label>
            <select name="sabor" id="sabor" onchange="toggleInputs()">
                <option value="MOSTRADOR_COMPLETO">📸 VITRINA COMPLETA</option>
                <option value="Jamón y Queso (JQ)">Jamón y Queso (JQ)</option>
                <option value="Humita (HM)">Humita (HM)</option>
                <!-- Agrega resto de sabores -->
            </select>
            
            <div id="manualInputs" style="display:none;">
                <label>Cajones:</label><input type="number" name="cajones" value="0">
                <label>Bandejas:</label><input type="number" name="bandejas" value="0">
            </div>

            <div class="file-box">
                <label>📷 BOTÓN CÁMARA (Directo):</label>
                <input type="file" name="foto" accept="image/*" capture="environment">
            </div>
            <div class="file-box">
                <label>🖼️ BOTÓN GALERÍA:</label>
                <input type="file" name="foto_galeria" accept="image/*">
            </div>
            <button type="submit" id="btnCalcular">➕ Sumar al Inventario</button>
        </form>
    </div>
    <div class="card">
        <h3>Resumen</h3>
        <table id="tabla" width="100%"><thead><tr><th>Sabor</th><th>Total</th></tr></thead><tbody id="tablaBody"></tbody></table>
        <button class="btn-limpiar" onclick="limpiar()">🗑️ Borrar</button>
    </div>
    <script>
        function toggleInputs() {
            document.getElementById('manualInputs').style.display = (document.getElementById('sabor').value === 'MOSTRADOR_COMPLETO') ? 'none' : 'block';
        }
        function limpiar() { location.reload(); }
        document.getElementById('inventarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnCalcular');
            btn.innerText = 'Procesando...';
            const formData = new FormData(e.target);
            const res = await fetch('/calcular', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.error) alert(data.error);
            else location.reload(); // Recarga simple para mostrar cambios
        });
    </script>
</body>
</html>
